<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="author" content="Marie Frison">
<title>Mission Client CAP EPC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Comic+Neue:wght@400;700&display=swap">
<style>
/* Layout : poste de pilotage projeté au tableau — contenu de la mission à gauche, tableau des scores fixe à droite ; carte des missions en étiquettes de prix. */
/* Thème unique et coloré, choisi pour la projection en classe : menthe pâle, bleu ciel, violet. */
:root{
  --bg:#e7f8f0; --mint:#c9f0dd; --sky:#d6e6ff; --lav:#e6dcff;
  --surface:rgba(255,255,255,.86); --surface-2:#f3f0ff; --ink:#22184a; --muted:#5d5683; --line:#d8d0f3;
  --accent:#7444f0; --accent-ink:#ffffff; --accent-soft:#ece5ff; --blue:#2f72f0; --ok:#119a62; --ok-soft:#d6f5e6; --ko:#d23a6b; --ko-soft:#fde3ec;
  --cA:#7a45f0; --cB:#2f72f0; --cC:#14a56c; --cD:#cf48b4;
  --grad:linear-gradient(120deg,#7444f0,#2f72f0 50%,#14a56c);
  --f-display:"Comic Sans MS", "Comic Sans", "Comic Neue", "Chalkboard SE", cursive;
  --f-body:"Comic Sans MS", "Comic Sans", "Comic Neue", "Chalkboard SE", cursive;
  --r:18px; color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5;min-height:100vh;position:relative;overflow-x:hidden}
.blobs{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blobs i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;animation:drift 22s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:46vw;height:46vw;background:var(--lav);left:-10vw;top:-12vw}
.blobs i:nth-child(2){width:40vw;height:40vw;background:var(--sky);right:-8vw;top:20vh;animation-duration:27s;animation-delay:-6s}
.blobs i:nth-child(3){width:38vw;height:38vw;background:var(--mint);left:25vw;bottom:-18vw;animation-duration:31s;animation-delay:-12s}
@keyframes drift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,4vh) scale(1.12)}100%{transform:translate(-4vw,-3vh) scale(.95)}}
#app{position:relative;z-index:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;width:100%;height:100%}
.enter > *{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.enter > *:nth-child(2){animation-delay:.06s}.enter > *:nth-child(3){animation-delay:.12s}.enter > *:nth-child(4){animation-delay:.18s}.enter > *:nth-child(5){animation-delay:.24s}
@keyframes rise{from{opacity:.25;transform:translateY(18px)}to{opacity:1;transform:none}}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:1320px;margin:0 auto;padding-inline:20px;padding-block:0 40px}

/* barre haute */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:10px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.01em}
.brand span{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);font-weight:700}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 16px;font-weight:700;font-size:.92rem}
.btn:hover{border-color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.big{font-size:1.1rem;padding:13px 28px}
.btn:disabled{opacity:.4;cursor:default}
.timer{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 14px}
.timer output{font-family:var(--f-display);font-weight:800;font-size:1.35rem;font-variant-numeric:tabular-nums;min-width:4.2ch}
.timer.out{border-color:var(--ko);animation:pulse 1s infinite}
.timer.out output{color:var(--ko)}
@keyframes pulse{50%{box-shadow:0 0 0 6px var(--ko-soft)}}
.ic{border:0;background:var(--surface-2);border-radius:999px;width:34px;height:34px;font-size:.95rem;font-weight:700}
.ic:hover{background:var(--line)}
.timer select{border:0;background:transparent;font:inherit;font-size:.82rem;color:var(--muted)}

/* grille principale */
.grid{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;margin-top:24px;align-items:start}
@media (max-width:980px){.grid{grid-template-columns:minmax(0,1fr)}}

/* tableau des scores */
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:980px){.board{position:static}}
.board h3{font-size:1.05rem;margin-bottom:4px}
.board p.hint{margin:0 0 12px;font-size:.8rem;color:var(--muted)}
.team{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.team .nm{font-weight:700;overflow-wrap:anywhere}
.team .sc{font-family:var(--f-display);font-weight:800;font-size:1.9rem;font-variant-numeric:tabular-nums;text-align:right;line-height:1}
.team .pts{grid-column:1/-1;display:flex;gap:6px}
.team .pts button{flex:1;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:5px 0;font-weight:700;font-size:.9rem}
.team .pts button:hover{border-color:var(--ink)}
.team.lead .nm::after{content:"  en tête";font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--accent)}
.board .reset{margin-top:10px;width:100%;border:1px dashed var(--line);background:transparent;border-radius:8px;padding:7px;font-size:.82rem;color:var(--muted)}
.board .reset.arm{border-color:var(--ko);color:var(--ko);font-weight:700}

/* accueil */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:32px;align-items:center;padding-block:40px 24px}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.14em;font-weight:700;color:var(--accent)}
.hero h1{font-size:clamp(2.6rem,7vw,5.2rem);font-weight:800;letter-spacing:-.03em;margin-top:8px}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p.lead{font-size:1.15rem;color:var(--muted);max-width:52ch;margin:16px 0 0}
.setup{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px}
.setup label{font-weight:700;font-size:.9rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;width:44px;height:40px;font-weight:700}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.names input{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 10px;font:inherit;color:var(--ink)}
.rules3{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:8px}
@media (max-width:1000px){.rules3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.rules3{grid-template-columns:minmax(0,1fr)}}
.rule{border-top:3px solid var(--ink);padding-top:10px}
.rule b{display:block;font-family:var(--f-display);font-size:1.1rem;margin-bottom:4px}
.rule p{margin:0;color:var(--muted);font-size:.95rem}
.cartons{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px;align-items:center}
.cartons small{color:var(--muted);margin-right:4px}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:34px;padding:0 10px;border-radius:6px;font-weight:800;color:#fff;font-family:var(--f-display)}
.chip.A{background:var(--cA)}.chip.B{background:var(--cB)}.chip.C{background:var(--cC)}.chip.D{background:var(--cD);color:#1b1400}

/* carte des missions : étiquettes */
.map-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.map-head h2{font-size:2rem;font-weight:800}
.map-head p{margin:4px 0 0;color:var(--muted)}
.tags{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.tag{position:relative;text-align:left;border:0;background:var(--surface);border-radius:6px 18px 18px 6px;padding:20px 20px 18px 42px;display:grid;gap:8px;box-shadow:0 1px 0 var(--line),0 0 0 1px var(--line);transition:transform .15s}
.tag:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 0 0 2px var(--ink)}
.tag::before{content:"";position:absolute;left:14px;top:22px;width:14px;height:14px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 2px var(--line)}
.tag::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:6px 0 0 6px;background:var(--tc)}
.tag .no{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--muted)}
.tag h3{font-size:1.35rem;font-weight:800}
.tag p{margin:0;font-size:.92rem;color:var(--muted)}
.tag .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.pill{font-size:.75rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface-2);border:1px solid var(--line)}
.pill.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}

/* mission */
.crumb{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:.9rem}
.crumb button{border:0;background:none;color:var(--blue);font-weight:700;padding:0}
.mtitle{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:800;margin-top:6px}
.todo{margin-top:16px;background:var(--accent-soft);border-radius:var(--r);padding:14px 18px;display:grid;gap:4px}
.todo b{font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent)}
.todo p{margin:0}
.dots{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px}
.dots button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.dots button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.dots button.seen{border-color:var(--ok);color:var(--ok)}
.card{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,32px)}
.qlabel{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--muted)}
.q{font-family:var(--f-display);font-weight:600;font-size:clamp(1.35rem,2.6vw,1.9rem);line-height:1.25;margin:8px 0 0;text-wrap:balance}
.dlg{display:grid;gap:8px;margin-top:14px}
.line{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;align-items:start}
.line .who{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;padding-top:6px;color:var(--muted)}
.line .say{background:var(--surface-2);border-radius:4px 14px 14px 14px;padding:10px 14px;font-size:1.08rem}
.line.v .say{background:var(--accent-soft)}
@media (max-width:520px){.line{grid-template-columns:minmax(0,1fr);gap:2px}}
.opts{display:grid;gap:10px;margin-top:20px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:start;border:2px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.opt .txt{font-size:1.08rem;padding-top:4px}
.opt .why{grid-column:2;font-size:.92rem;color:var(--muted);margin-top:-4px}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.bad{opacity:.62}
.opts.vf{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.opts.vf{grid-template-columns:minmax(0,1fr)}}
.opts.vf .opt{grid-template-columns:auto minmax(0,1fr);align-items:center}
.reveal{margin-top:20px;border-top:2px solid var(--ink);padding-top:16px;display:grid;gap:8px}
.reveal b.v{font-family:var(--f-display);font-size:1.3rem}
.reveal p{margin:0;max-width:75ch}
.reveal .tip{font-size:.92rem;color:var(--muted)}
.acts{display:flex;justify-content:space-between;gap:10px;margin-top:20px;flex-wrap:wrap}
.acts .mid{display:flex;gap:10px;flex-wrap:wrap}

/* ordre */
.pool,.slots{display:grid;gap:8px;margin-top:14px}
.pool button{text-align:left;border:1px dashed var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 14px;font-size:1.02rem}
.pool button:hover{border-style:solid;border-color:var(--ink)}
.slot{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:48px;background:var(--surface)}
.slot .n{font-family:var(--f-display);font-weight:800;font-size:1.2rem;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums}
.slot .x{border:0;background:none;color:var(--muted);font-size:1rem}
.slot.ok{border-color:var(--ok);background:var(--ok-soft)}
.slot.ko{border-color:var(--ko);background:var(--ko-soft)}
.slot .lab{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--ok)}
.cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.cols2{grid-template-columns:minmax(0,1fr)}}
.sub{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--muted);margin-top:14px}

/* reformulation */
.bad-phrase{font-family:var(--f-display);font-weight:800;font-size:clamp(1.8rem,4.5vw,3rem);margin-top:10px;color:var(--ko);text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:color-mix(in srgb,var(--ko) 45%,transparent)}
.ctx{color:var(--muted);margin:6px 0 0}
.sugg{display:grid;gap:8px}
.sugg div{background:var(--ok-soft);border-left:4px solid var(--ok);padding:10px 14px;border-radius:0 8px 8px 0;font-size:1.1rem}

/* jeu de rôle */
.roles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}
@media (max-width:700px){.roles{grid-template-columns:minmax(0,1fr)}}
.role{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface-2)}
.role b{display:block;font-size:.75rem;text-transform:uppercase;letter-spacing:.12em;margin-bottom:4px}
.role.v b{color:var(--accent)}.role.c b{color:var(--blue)}
.role p{margin:0}
.twist{margin-top:12px;border:2px dashed var(--accent);border-radius:10px;padding:10px 14px}
.twist b{color:var(--accent)}
.grille{display:grid;gap:6px;margin-top:10px}
.grille label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.grille input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);flex:none}
.award{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.award .tot{font-family:var(--f-display);font-weight:800;font-size:1.6rem;font-variant-numeric:tabular-nums}
.award select{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20}

/* règles */
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:grid;place-items:center;padding:16px;z-index:30}
.modal .box{background:var(--surface);border-radius:var(--r);max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:24px;display:grid;gap:12px}
.modal ol{margin:0;padding-left:1.2em;display:grid;gap:4px}
.end{text-align:center;padding:30px 10px}
.end h2{font-size:2.2rem;font-weight:800}
/* buzzer */
.buzz{margin-top:22px;border:2px solid var(--line);border-radius:var(--r);padding:14px;background:var(--surface-2);display:grid;gap:12px}
.buzz-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.buzz-head b{font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.buzz-head .st{font-weight:700}
.buzz-head .st.open{color:var(--ok)}
.pads{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.pad{border:0;border-radius:14px;padding:14px 10px 12px;background:var(--bc);color:#fff;display:grid;gap:2px;justify-items:center;box-shadow:inset 0 -5px 0 rgba(0,0,0,.22);transition:transform .08s}
.pad:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.22)}
.pad .k{font-family:var(--f-display);font-weight:800;font-size:1.35rem;line-height:1.1;border:2px solid rgba(255,255,255,.75);border-radius:8px;padding:6px 12px;margin-bottom:4px}
.pad{cursor:default}
.pad .tn{font-size:.85rem;font-weight:700;overflow-wrap:anywhere;text-align:center}
.pad.off{opacity:.28;filter:grayscale(.7)}
.pad.won{outline:4px solid var(--ink);outline-offset:3px;animation:pop .5s}
@keyframes pop{30%{transform:scale(1.08)}}
.buzzed{border-radius:12px;padding:16px;background:var(--bc);color:#fff;display:grid;gap:10px}
.buzzed .big{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,4vw,2.6rem);line-height:1.05}
.buzzed .row{display:flex;gap:8px;flex-wrap:wrap}
.buzzed .row button{border:0;border-radius:999px;padding:9px 16px;font-weight:700;background:rgba(255,255,255,.92);color:#141c33}
.buzzed .row button.w{background:rgba(0,0,0,.28);color:#fff}
.early{color:var(--ko);font-weight:700}
.arows{display:grid;gap:8px}
.arow{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.arow.locked{border-color:var(--ink)}
.arow .an{font-weight:700;overflow-wrap:anywhere}
.arow .ar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bz{display:flex;gap:8px;flex-wrap:wrap}
.bzb{border:0;width:58px;height:50px;border-radius:12px;font-family:var(--f-display);font-weight:800;font-size:1.5rem;color:#fff;box-shadow:inset 0 -5px 0 rgba(0,0,0,.25)}
.bzb:active{transform:translateY(3px);box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.bzb.A{background:var(--cA)}.bzb.B{background:var(--cB)}.bzb.C{background:var(--cC)}.bzb.D{background:var(--cD);color:#1b1400}
.res{display:inline-flex;gap:10px;align-items:center;font-weight:700}
.res.ok{color:var(--ok)}.res.ko{color:var(--ko)}.res.lock{color:var(--ink)}
.chg{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:.85rem}
@media (max-width:520px){.arow{grid-template-columns:minmax(0,1fr)}}
.keys-help{font-size:.82rem;color:var(--muted)}
/* ===== habillage coloré et animations ===== */
.top{background:rgba(255,255,255,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{color:var(--blue)}
.btn{border-radius:999px;border-color:var(--line);background:#fff;transition:transform .15s,box-shadow .15s}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 16px rgba(116,68,240,.18);border-color:var(--accent)}
.btn.primary{background:var(--grad);background-size:200% 100%;border:0;color:#fff;animation:sheen 6s linear infinite;box-shadow:0 6px 18px rgba(116,68,240,.3)}
@keyframes sheen{to{background-position:200% 0}}
.timer{background:#fff}
.timer.hurry{border-color:var(--cD)}
.timer.hurry output{color:var(--cD);animation:tick 1s infinite}
@keyframes tick{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.timer.out{animation:shake .5s 3,pulse 1s infinite}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.hero h1{line-height:.98}
.hero h1 em{background:var(--grad);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sheen 5s linear infinite}
.hero .eyebrow{display:inline-block;background:#fff;border:1px solid var(--line);border-radius:999px;padding:5px 12px;color:var(--accent)}
.orbit{position:relative;height:0}
.spark{position:absolute;width:16px;height:16px;border-radius:50%;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-16px) rotate(20deg)}}
.setup{background:rgba(255,255,255,.88);border:0;box-shadow:0 18px 50px rgba(60,40,140,.14);border-radius:24px}
.seg button{border-radius:12px;transition:transform .12s}
.seg button:hover{transform:translateY(-2px)}
.seg button.on{background:var(--grad);border:0;color:#fff}
.rule{border:0;background:rgba(255,255,255,.75);border-radius:18px;padding:16px 18px;position:relative;overflow:hidden}
.rule::before{content:"";position:absolute;left:0;top:0;right:0;height:5px;background:var(--rc,var(--accent))}
.rule:nth-child(1){--rc:var(--cA)}.rule:nth-child(2){--rc:var(--cB)}.rule:nth-child(3){--rc:var(--cC)}.rule:nth-child(4){--rc:var(--cD)}
.jk{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap}
.jb{flex:1 1 auto;display:inline-flex;gap:4px;align-items:center;justify-content:center;border:1px solid #cbbcf7;background:#f6f2ff;border-radius:999px;padding:4px 8px;font-size:.74rem;font-weight:700;white-space:nowrap;transition:transform .12s}
.jb:hover:not(:disabled){transform:translateY(-2px);border-color:var(--accent)}
.jb:disabled{opacity:.45;cursor:default}
.jb.used{opacity:.3;text-decoration:line-through;filter:grayscale(1)}
.jb.armed{background:var(--grad);color:#fff;border-color:transparent;opacity:1;animation:armed 1.2s ease-in-out infinite}
@keyframes armed{50%{box-shadow:0 0 0 6px rgba(116,68,240,.22)}}
.steal{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:5px;align-items:center;background:#fff3fb;border:1px dashed var(--cD);border-radius:12px;padding:6px 8px;font-size:.82rem;animation:rise .3s both}
.steal span{font-weight:700;color:var(--cD);width:100%}
.steal button{border:0;background:var(--cD);color:#fff;border-radius:999px;padding:3px 10px;font-weight:700;font-size:.8rem}
.steal .sx{background:transparent;color:var(--muted);text-decoration:underline}
.jbadge{display:inline-block;margin-left:8px;background:var(--grad);color:#fff;border-radius:999px;padding:1px 9px;font-size:.75rem;font-weight:700;animation:armed 1.2s ease-in-out infinite;vertical-align:middle}
.toast{max-width:min(92vw,720px);text-align:center;border-radius:20px}
.evb{display:flex;gap:14px;align-items:center;margin-top:20px;border-radius:18px;padding:12px 16px;color:#fff;background:linear-gradient(120deg,var(--ec),color-mix(in srgb,var(--ec) 60%,#2f72f0));animation:rise .5s both;box-shadow:0 10px 30px rgba(60,40,140,.2)}
.evb .ei{font-size:2.2rem;animation:bob 2s ease-in-out infinite}
.evb b{font-size:1.2rem}
.evb p{margin:0;opacity:.95}
.wheel-btn{border-color:#cf48b4;color:#a3318e}
.wheel-ov{position:fixed;inset:0;z-index:35;display:grid;place-items:center;padding:16px;background:rgba(34,24,74,.55);backdrop-filter:blur(4px);animation:fadein .3s both;font-family:var(--f-body);color:var(--ink)}
@keyframes fadein{from{opacity:0}}
.wheel-box{background:#fff;border-radius:28px;padding:22px;width:min(560px,100%);max-height:95vh;overflow:auto;display:grid;gap:14px;justify-items:center;text-align:center;box-shadow:0 30px 80px rgba(20,10,60,.4);animation:rise .5s both}
.wheel-box h2{font-family:var(--f-display);font-size:1.9rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.wheel-wrap{position:relative;width:min(380px,78vw);aspect-ratio:1;max-width:100%}
.wheel{position:absolute;inset:0;border-radius:50%;border:8px solid #fff;box-shadow:0 0 0 4px #e6dcff,0 14px 40px rgba(60,40,140,.3)}
.wl{position:absolute;inset:0;display:flex;justify-content:center}
.wl span{display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:7%;width:30%;color:#fff;font-weight:700;font-size:clamp(.62rem,2.2vw,.82rem);line-height:1.1;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.wl i{font-style:normal;font-size:clamp(1.3rem,4.5vw,1.9rem)}
.hub{position:absolute;left:50%;top:50%;width:16%;height:16%;transform:translate(-50%,-50%);border-radius:50%;background:#fff;box-shadow:0 0 0 5px #e6dcff}
.pointer{position:absolute;left:50%;top:-14px;transform:translateX(-50%);width:0;height:0;border-left:16px solid transparent;border-right:16px solid transparent;border-top:30px solid #22184a;z-index:2;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25))}
.wres{display:grid;gap:12px;justify-items:center;min-height:60px}
.spinning{font-weight:700;color:var(--accent);animation:bob 1s infinite}
.wwin{border-radius:18px;padding:14px 18px;color:#fff;background:var(--ec);display:grid;gap:4px;justify-items:center;animation:win .8s both}
.wwin .ei{font-size:2.6rem}
.wwin b{font-family:var(--f-display);font-size:1.5rem}
.wwin p{margin:0}
.wwin .wmsg{font-weight:700;background:rgba(255,255,255,.2);border-radius:999px;padding:3px 12px;margin-top:4px}
.refbox{margin-top:10px;display:grid;gap:2px;background:#fff;border:1px solid var(--line);border-left:5px solid var(--blue);border-radius:14px;padding:10px 14px;font-size:.92rem}
.refbox b{color:var(--blue);font-size:.8rem;text-transform:uppercase;letter-spacing:.08em}
.refbox .rc{font-weight:700}
.refbox .ri{color:var(--muted)}
.pill.ref{background:#e3edff;border-color:#bcd2ff;color:#1f4fb8}
.qic{font-size:3rem;line-height:1;margin-bottom:6px;display:inline-block;animation:bob 3s ease-in-out infinite}
.speak{float:right;border:0;border-radius:999px;padding:8px 16px;font-weight:700;color:#fff;background:var(--grad);box-shadow:0 6px 16px rgba(116,68,240,.25);transition:transform .12s;margin:0 0 8px 12px}
.speak:hover{transform:scale(1.05)}
.newgame{width:100%;border:2px dashed #b9a8f3;background:transparent;border-radius:999px;padding:9px 14px;font-weight:700;color:var(--muted);transition:transform .12s}
.newgame:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-2px)}
.newgame.arm{border-style:solid;border-color:var(--ko);color:#fff;background:var(--ko);animation:armed 1s infinite}
.duty{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--grad);color:#fff;border-radius:999px;padding:8px 18px;width:fit-content;max-width:100%;margin-bottom:14px;font-size:1.05rem;animation:rise .4s both}
.duty b{font-size:1.2rem}
.duty .chg{color:#fff;opacity:.85}
.olet{display:inline-grid;place-items:center;min-width:28px;height:28px;margin-right:10px;border-radius:8px;background:var(--accent);color:#fff;font-weight:700;font-size:.95rem;vertical-align:middle}
.pool button{display:flex;align-items:center}
.pool button.placed{opacity:.35;text-decoration:line-through;border-style:solid}
.pool button:disabled{cursor:default}
.pool button:disabled:hover{transform:none}
.reveal li{margin-bottom:6px}
.phases{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:16px}
.ph{border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px;display:grid;justify-items:center;gap:2px;transition:transform .12s}
.ph:hover{transform:translateY(-2px);border-color:var(--accent)}
.ph b{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent)}
.ph span{font-weight:700}
.ph small{color:var(--muted);font-variant-numeric:tabular-nums}
.ph.on{background:var(--grad);border-color:transparent;color:#fff}
.ph.on b{background:rgba(255,255,255,.25);color:#fff}
.ph.on small{color:#fff}
.memo-btn{margin-left:auto}
.box.memo{max-width:1000px}
.mhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.mhead h2{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.mcard{background:linear-gradient(150deg,#f6f2ff,#eaf2ff);border-radius:16px;padding:12px 14px;animation:rise .4s both}
.mcard:nth-child(2){animation-delay:.05s;background:linear-gradient(150deg,#e9f8f0,#eaf2ff)}.mcard:nth-child(3){animation-delay:.1s}.mcard:nth-child(4){animation-delay:.15s;background:linear-gradient(150deg,#e9f8f0,#f6f2ff)}.mcard:nth-child(5){animation-delay:.2s}.mcard:nth-child(6){animation-delay:.25s;background:linear-gradient(150deg,#e9f8f0,#eaf2ff)}
.mcard h3{font-size:1.1rem;color:var(--accent);margin-bottom:6px}
.mcard dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:.92rem}
.mcard dt{font-weight:700;color:var(--blue)}
.mcard dd{margin:0}
.chip{border-radius:10px;animation:bob 3s ease-in-out infinite}
.cartons .chip:nth-child(3){animation-delay:.2s}.cartons .chip:nth-child(4){animation-delay:.4s}.cartons .chip:nth-child(5){animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-4px)}}
.opts .chip,.arow .chip{animation:none}

.map-head h2{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{background:linear-gradient(160deg,#fff 40%,var(--tbg,#f3f0ff));box-shadow:0 10px 30px rgba(60,40,140,.10);border-radius:10px 26px 26px 10px;animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
.tag:nth-child(1){--tbg:#ece4ff;animation-delay:.03s}.tag:nth-child(2){--tbg:#dde9ff;animation-delay:.09s}.tag:nth-child(3){--tbg:#d9f5e7;animation-delay:.15s}
.tag:nth-child(4){--tbg:#f7e2f5;animation-delay:.21s}.tag:nth-child(5){--tbg:#dde9ff;animation-delay:.27s}.tag:nth-child(6){--tbg:#ece4ff;animation-delay:.33s}
.tag:hover{transform:translateY(-6px) rotate(-1deg);box-shadow:0 18px 40px rgba(60,40,140,.2)}
.tag::after{width:8px}
.tag .big{position:absolute;right:16px;top:8px;font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1;color:var(--tc);opacity:.18}

.mtitle{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-bottom:4px}
.todo{background:linear-gradient(120deg,var(--accent-soft),#e1edff);border:1px solid #ddd2ff}
.todo b{color:var(--accent)}
.card{background:rgba(255,255,255,.92);border:0;box-shadow:0 18px 50px rgba(60,40,140,.12);border-radius:24px}
.dots button{transition:transform .15s}
.dots button:hover{transform:scale(1.12)}
.dots button.on{background:var(--grad);border:0;color:#fff;transform:scale(1.12)}
.line .say{background:#e3edff}
.line.v .say{background:#eae2ff}
.opt{border-radius:14px;transition:transform .15s,border-color .15s}
.opt.good{animation:win .9s cubic-bezier(.2,.8,.2,1)}
@keyframes win{0%{transform:scale(1)}35%{transform:scale(1.035);box-shadow:0 0 0 10px var(--ok-soft)}100%{transform:scale(1)}}
.opt.bad{transform:scale(.985)}
.reveal{border-top:0;background:linear-gradient(120deg,#e3f8ee,#e7eeff);border-radius:16px;padding:16px 18px;animation:rise .45s both}

.board{background:rgba(255,255,255,.9);border:0;box-shadow:0 18px 50px rgba(60,40,140,.12);border-radius:24px}
.board h3{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.team .sc{display:inline-block}
.team.pop .sc{animation:scorepop .6s cubic-bezier(.2,.8,.2,1)}
.team.popdown .sc{animation:scoredown .5s}
@keyframes scorepop{0%{transform:scale(1)}40%{transform:scale(1.6);color:var(--ok)}100%{transform:scale(1)}}
@keyframes scoredown{40%{transform:translateY(4px);color:var(--ko)}}
.team.lead{background:linear-gradient(90deg,#efe8ff,transparent);border-radius:12px;padding-inline:8px}
.team .pts button{border-radius:10px;transition:transform .12s}
.team .pts button:hover{transform:translateY(-2px)}

.buzz{background:linear-gradient(140deg,#f1ecff,#e4f0ff 60%,#e1f7ec);border:0;border-radius:20px}
.arow{border-radius:14px;transition:transform .2s}
.arow.locked{border-color:var(--accent);background:#f6f2ff}
.arow.locked .res.lock{animation:rise .4s both}
.bzb{width:64px;height:56px;border-radius:16px;transition:transform .12s}
.bzb:hover{transform:translateY(-3px) scale(1.06)}
.bzb.D{color:#fff}
.chip.D{color:#fff}
.res.ok .chip{animation:win .9s}
.slot{border-radius:12px}
.slot.ok{animation:win .7s}
.slot.ko{animation:shake .4s 1}
.pool button{border-radius:12px;border-color:#b9a8f3;background:#f6f2ff;transition:transform .12s}
.pool button:hover{transform:translateX(4px)}
.sugg div{animation:rise .5s both}
.sugg div:nth-child(2){animation-delay:.12s}
.bad-phrase{color:var(--ko)}
.twist{border-color:var(--cD);animation:rise .4s both}
.twist b{color:var(--cD)}
.role.v b{color:var(--accent)}
.toast{background:var(--grad);animation:toastin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes toastin{from{transform:translate(-50%,20px);opacity:.2}}
.end h2{font-size:clamp(2.2rem,6vw,3.6rem);background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise .6s both}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:12px;margin:26px auto 10px;max-width:560px}
.podium div{flex:1;border-radius:16px 16px 6px 6px;color:#fff;padding:12px 8px;display:grid;gap:4px;align-content:start;animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:bottom}
.podium b{font-family:var(--f-display);font-size:1.6rem}
.podium span{font-weight:700;overflow-wrap:anywhere;font-size:.9rem}
@keyframes grow{from{transform:scaleY(.15)}}
.buzz.closed{background:linear-gradient(140deg,#efedf7,#e9eef8)}
.lockbox{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.lockacts{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:700px){.lockbox{grid-template-columns:auto minmax(0,1fr)}.lockacts{grid-column:1/-1;justify-content:flex-start}}
.lockbox .lk{font-size:2rem;animation:bob 2.4s ease-in-out infinite}
.lockbox .lt{font-family:var(--f-display);font-size:1.15rem}
.lockbox p{margin:2px 0 0;color:var(--muted);font-size:.95rem}
.bzb.off{display:inline-grid;place-items:center;opacity:.25;filter:grayscale(.8);box-shadow:none}
.buzz.opened{animation:openup .6s cubic-bezier(.2,.8,.2,1)}
@keyframes openup{0%{transform:scale(.97);box-shadow:0 0 0 0 rgba(116,68,240,.5)}60%{transform:scale(1.01);box-shadow:0 0 0 14px rgba(116,68,240,0)}100%{transform:none}}

/* ===== THÈME JEU VIDÉO (arcade néon) ===== */
:root{
  --bg:#0b0920; --surface:rgba(22,18,58,.9); --surface-2:#1c1748; --ink:#f2efff; --muted:#aaa3d8; --line:#3a3378;
  --accent:#ff3df2; --accent-ink:#fff; --accent-soft:rgba(255,61,242,.14); --blue:#22e6ff; --ok:#3dff9a; --ok-soft:rgba(61,255,154,.13); --ko:#ff4d7d; --ko-soft:rgba(255,77,125,.15);
  --cA:#9b4dff; --cB:#1f8fff; --cC:#12b36a; --cD:#e83aa8; --cyan:#22e6ff; --yellow:#ffd23d;
  --grad:linear-gradient(120deg,#ff3df2,#8b5cff 45%,#22e6ff);
  --panel:rgba(22,18,58,.88);
  --f-display:"Bungee","Comic Sans MS","Comic Neue",cursive;
  color-scheme:dark;
}
body{background:radial-gradient(ellipse at 50% -10%,#3b1d7c 0%,#140d38 45%,#07061a 100%) fixed;color:var(--ink)}
.blobs i{display:none}
.blobs::before{content:"";position:absolute;left:-50%;right:-50%;bottom:-8%;height:58vh;background-image:linear-gradient(rgba(255,61,242,.45) 1px,transparent 1px),linear-gradient(90deg,rgba(34,230,255,.35) 1px,transparent 1px);background-size:64px 64px;transform:perspective(520px) rotateX(64deg);transform-origin:bottom;animation:gridmove 3.5s linear infinite;-webkit-mask-image:linear-gradient(to top,#000 5%,transparent 85%);mask-image:linear-gradient(to top,#000 5%,transparent 85%)}
@keyframes gridmove{to{background-position:0 64px,0 0}}
.blobs::after{content:"";position:absolute;inset:0;background-image:radial-gradient(1.6px 1.6px at 8% 12%,#fff,transparent),radial-gradient(1.4px 1.4px at 22% 34%,#9ff,transparent),radial-gradient(1.8px 1.8px at 41% 8%,#fff,transparent),radial-gradient(1.3px 1.3px at 63% 22%,#f9f,transparent),radial-gradient(1.6px 1.6px at 79% 9%,#fff,transparent),radial-gradient(1.4px 1.4px at 91% 30%,#9ff,transparent),radial-gradient(1.2px 1.2px at 52% 40%,#fff,transparent),radial-gradient(1.5px 1.5px at 14% 48%,#f9f,transparent);animation:twinkle 3s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.35}to{opacity:.9}}
h1,h2,h3,.q{letter-spacing:.01em}
.top{background:rgba(9,7,28,.78);border-bottom:1px solid rgba(139,92,255,.45);box-shadow:0 0 24px rgba(139,92,255,.2)}
.brand b{font-family:var(--f-display);font-weight:400}
.brand span{color:var(--cyan)}
.btn{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn:hover:not(:disabled){border-color:var(--cyan);box-shadow:0 0 18px rgba(34,230,255,.35)}
.btn.primary{border-radius:14px;font-family:var(--f-display);font-weight:400;letter-spacing:.03em;box-shadow:0 5px 0 #4b1a7d,0 0 22px rgba(255,61,242,.45)}
.btn.primary:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 #4b1a7d,0 0 14px rgba(255,61,242,.4)}
.timer{background:var(--surface-2);border-color:var(--line)}
.timer output{font-family:var(--f-display);font-weight:400;color:var(--cyan);text-shadow:0 0 10px rgba(34,230,255,.8)}
.timer.hurry output{color:var(--yellow);text-shadow:0 0 12px rgba(255,210,61,.9)}
.timer.out output{color:var(--ko);text-shadow:0 0 12px rgba(255,77,125,.9)}
.ic{background:#2a2366;color:var(--ink)}.ic:hover{background:#3a3388}
.timer select,.award select{color:var(--ink);background:#17123f}
.timer select option,.award select option{background:#17123f;color:var(--ink)}
.setup,.card,.board,.rule,.modal .box,.wheel-box{background:var(--panel);border:1px solid rgba(139,92,255,.5);box-shadow:0 0 0 1px rgba(34,230,255,.08),0 0 34px rgba(139,92,255,.22)}
.hero h1{font-family:var(--f-display);font-weight:400;filter:drop-shadow(0 0 14px rgba(255,61,242,.45))}
.hero h1 em{font-style:normal}
.hero .eyebrow{background:var(--surface-2);border-color:var(--line);color:var(--cyan)}
.hero p.lead,.rule p,.map-head p,.ctx,.lockbox p,.refbox .ri,.keys-help,.board p.hint{color:var(--muted)}
.seg button{background:var(--surface-2);border-color:var(--line);color:var(--ink)}
.names input{background:#120e33;border-color:var(--line);color:var(--ink)}
.rule b{font-family:var(--f-display);font-weight:400;font-size:1rem}
.map-head h2,.mtitle,.board h3,.mhead h2,.end h2{font-family:var(--f-display);font-weight:400;filter:drop-shadow(0 0 10px rgba(139,92,255,.6))}
.tag{background:linear-gradient(160deg,#1f1955,#130f38);box-shadow:0 0 0 1px rgba(139,92,255,.5),0 0 26px rgba(139,92,255,.15)}
.tag:nth-child(n){background:linear-gradient(160deg,#1f1955,#130f38)}
.tag:hover{box-shadow:0 0 0 2px var(--tc),0 0 36px color-mix(in srgb,var(--tc) 55%,transparent)}
.tag::before{background:#07061a;box-shadow:inset 0 0 0 2px var(--line)}
.tag h3{font-family:var(--f-display);font-weight:400;font-size:1.15rem}
.tag .no{color:var(--cyan);font-family:var(--f-display);font-weight:400;letter-spacing:.14em}
.tag .big{opacity:.4;text-shadow:0 0 18px var(--tc);font-family:var(--f-display);font-weight:400}
.tag p{color:var(--muted)}
.pill{background:#241e5a;border-color:var(--line);color:var(--ink)}
.pill.ref{background:rgba(34,230,255,.12);border-color:rgba(34,230,255,.45);color:#9ff6ff}
.pill.done{background:rgba(255,210,61,.14);border-color:var(--yellow);color:var(--yellow)}
.todo{background:linear-gradient(120deg,rgba(255,61,242,.14),rgba(34,230,255,.08));border:1px solid rgba(255,61,242,.45)}
.todo b{color:#ff8df7}
.refbox{background:#120e33;border-color:var(--line);border-left-color:var(--cyan)}
.refbox b{color:var(--cyan)}
.crumb{color:var(--muted)}.crumb button{color:var(--cyan)}
.dots button{background:#1c1748;border-color:var(--line);color:var(--ink)}

{ id:"c1", type:"qcm", why:true, color:"var(--cA)", title:"Je me prépare", skill:"Tenue, outils, posture et confiance avant l’arrivée du client", dur:60,

{ id:"c2", type:"qcm", why:true, memo:true, color:"var(--cB)", title:"J’accueille le client", skill:"SBAM, premier contact, téléphone, adaptation au client", dur:60,

  qs:[

   w:["Ce sont les 4 règles de base de l’accueil.","Le silence n’est pas un accueil !","Ce sont des mots du commerce, mais pas le SBAM."], e:"SBAM : Sourire, Bonjour, Au revoir, Merci. C’est la base de chaque contact client."},

  {ic:"☎️", t:"Le téléphone du magasin sonne. Que dis-tu ?", o:["« Allô ? »","« Magasin Sportland, Inès à votre écoute, bonjour ! »","« Oui, c’est pour quoi ? »"], a:1,

  {ic:"👀", t:"Le client te dit « Je regarde seulement ». Que fais-tu ?", o:["« D’accord, je reste à côté de vous. »","« Très bien, je suis au rayon si vous avez besoin. »","Je le suis dans le rayon sans rien dire."], a:1,

   w:["Elle se sent bousculée.","On s’adapte au rythme et au comportement du client.","Pas besoin : tu peux très bien t’occuper d’elle."], e:"S’adapter au client : son rythme, sa façon de parler, son humeur."},

{ id:"c3", type:"qcm", why:true, memo:true, memoOpen:true, color:"var(--cC)", title:"Je découvre et je conseille", skill:"Questions, écoute, reformulation, conseil, omnicanal, colis", dur:90,
  ref:{c:"Compétence 3 · Accompagner le parcours client dans un contexte omnicanal", i:"Questionnement pertinent, écoute active et empathie, conseils justes, présentation convaincante, services associés, outils numériques, remise des colis."},

/* confettis */
const RM = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
let parts=[], raf=null;
function confetti(n=120){
  if(RM) return; const cv=document.getElementById("fx"); if(!cv) return;
  const W=cv.width=innerWidth, H=cv.height=innerHeight, cols=["#7444f0","#2f72f0","#14a56c","#cf48b4","#9fd8ff","#b9f0d3"];
  for(let i=0;i<n;i++) parts.push({x:W*(.2+.6*Math.random()), y:H*.35, vx:(Math.random()-.5)*14, vy:-6-Math.random()*12, g:.32+Math.random()*.15, s:6+Math.random()*7, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:cols[i%cols.length], life:0, sh:Math.random()<.5});
  if(!raf) loop();
}
function loop(){
  const cv=document.getElementById("fx"), ctx=cv.getContext("2d"); ctx.clearRect(0,0,cv.width,cv.height);
  parts.forEach(p=>{ p.vy+=p.g; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; p.life++;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
    if(p.sh){ ctx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); } else { ctx.beginPath(); ctx.arc(0,0,p.s/2.4,0,7); ctx.fill(); } ctx.restore(); });
  parts=parts.filter(p=>p.y<cv.height+40&&p.life<400);
  raf = parts.length ? requestAnimationFrame(loop) : (ctx.clearRect(0,0,cv.width,cv.height), null);
}

function applyEvent(id){
  const msgs=[];
  if(id==="eclair"){ tReset(20); }
  if(id==="joker"){ const min=Math.min(...S.teams.map(t=>t.score));
    S.teams.forEach((t,i)=>{ if(t.score!==min) return; const st=S.jk[i]||{}; const back=["tor","vol","cours"].find(j=>st[j]);
      if(back){ delete st[back]; const J=JOKERS.find(x=>x.id===back); msgs.push(`${t.name} récupère ${J.icon} ${J.short}`); }
      else { t.score+=1; bump(i,1); msgs.push(`${t.name} : +1 (tous ses jokers déjà en main)`); } }); }
  if(id==="echange"){ const ord=S.teams.map((t,i)=>i).sort((a,b)=>S.teams[b].score-S.teams[a].score); const a=ord[0], b=ord[1];

  return msgs;
}
let wheelRot=0;
function openWheel(){

    <div class="wres" aria-live="polite"><button class="btn primary big" id="spin">Lancer la roue</button></div></div>`;
  document.body.appendChild(ov);
  const wheel=ov.querySelector(".wheel"), res=ov.querySelector(".wres");
  ov.querySelector("#spin").addEventListener("click",()=>{
    const k=Math.floor(Math.random()*n);

function speak(){
  try{
    const m=MISSIONS[S.m], q=m.qs[S.q], ss=window.speechSynthesis; if(!ss){ toast("La lecture à voix haute n’est pas disponible sur ce navigateur",2600); return; }
    ss.cancel();
    const clean=t=>String(t).replace(/[«»]/g,"").replace(/<[^>]+>/g,"");
    const parts=[];
    if(q.dlg) q.dlg.forEach(([w,t])=>parts.push(w+" : "+clean(t)));
    parts.push(clean(q.t));
    (q.o||[]).forEach((o,i)=>parts.push("Réponse "+LET[i]+" : "+clean(o)));
    const u=new SpeechSynthesisUtterance(parts.join(". ")); u.lang="fr-FR"; u.rate=.85;
    const v=ss.getVoices().find(v=>/^fr/i.test(v.lang)); if(v) u.voice=v;
    ss.speak(u);
  }catch(e){ toast("La lecture à voix haute n’est pas disponible",2400); }
}

    case "rev": { S.rev=true; tPause(); const m=MISSIONS[S.m], q=m.qs[S.q];
      if(S.mode==="abcd"&&(m.type==="vf"||m.type==="qcm")&&!S.scored){ S.scored=true; const win=[];
        const msgs=[]; let drama=false;
        S.teams.forEach((t,i)=>{ const ok=S.ans[i]===q.a, j=S.armed[i];
          if(j&&j.type==="tor"){ useJ(i,"tor"); drama=true;
            if(ok){ t.score+=BASE()+2; bump(i,1); win.push(t.name); msgs.push(`${t.name} : +${BASE()+2} (tout ou rien gagné)`); }
            else { t.score-=2; bump(i,-1); msgs.push(`${t.name} : −2 (tout ou rien perdu)`); } }
          else if(ok){ t.score+=BASE(); win.push(t.name); bump(i,1); } });
        if(S.event==="solid"){ if(S.teams.every((t,i)=>S.ans[i]===q.a)){ S.teams.forEach((t,i)=>{ t.score+=2; bump(i,1); }); msgs.push("🤝 Solidarité réussie : +2 pour tout le monde !"); drama=true; } else msgs.push("🤝 Solidarité ratée : il fallait que toutes les équipes trouvent"); }
        S.teams.forEach((t,i)=>{ const j=S.armed[i]; if(j&&j.type==="vol"){ useJ(i,"vol"); drama=true;
          const ok=S.ans[i]===q.a, tok=S.ans[j.target]===q.a, vic=S.teams[j.target];
          if(ok&&!tok){ vic.score-=2; t.score+=2; bump(i,1); bump(j.target,-1); msgs.push(`${t.name} vole 2 pts à ${vic.name} !`); }
          else msgs.push(`Vol raté pour ${t.name}`); } });
        const base=win.length?`Bonne réponse${S.event==="or"?" en or 💎":""} : ${win.join(", ")}`:"Aucune équipe n’a trouvé";
        toast([base,...msgs].join(" · "), msgs.length?4200:1800);
        if(win.length) setTimeout(()=>confetti(40+40*win.length+(drama?80:0)),150); }
      else if(m.type==="order"||m.type==="reform") setTimeout(()=>confetti(60),150);
      break; }
    case "ans": if(!S.bOpen) return; S.ans[+b.dataset.i]=v; tone(BFREQ[+b.dataset.i]); break;
    case "unans": delete S.ans[v]; break;
    case "finish": S.done[MISSIONS[S.m].id]=1; S.screen="end"; tPause(); setTimeout(()=>{confetti(180); setTimeout(()=>confetti(120),700);},300); break;
    case "pt": S.teams[+b.dataset.i].score+=v; bump(+b.dataset.i,v); if(v>0) tone(v>1?988:784); break;
    case "reset": if(S.resetArm){ S.teams.forEach(t=>t.score=0); S.resetArm=false; S.done={}; S.seen={}; S.jk={}; S.armed={}; S.stealFrom=null; resetQ(); tReset(); if(S.screen==="end") S.screen="home"; toast("Nouvelle partie prête : scores, jokers et missions remis à zéro",2600); } else S.resetArm=true; break;
    case "pick": S.pick.push(v); S.checked=false; break;
    case "unpick": S.pick.splice(v,1); S.checked=false; break;
    case "clear": S.pick=[]; S.checked=false; break;
    case "check": { S.checked=true; tPause(); const q=MISSIONS[S.m].qs[S.q], n=q.items.length, good=S.pick.filter((it,k)=>it===k).length;
      if(!S.ordScored){ S.ordScored=true; const err=n-good, p=err===0?2:err<=2?1:0, d=duty(); S.ordPts=p;
        if(p){ S.teams[d].score+=p; bump(d,1); toast(`+${p} pour ${S.teams[d].name}`); } }
      if(good===n) setTimeout(()=>confetti(110),200); break; }
    case "speak": speak(); return;
    case "wheel": S.wheelShown=true; openWheel(); return;
    case "dutynext": S.dutyShift=(S.dutyShift||0)+1; S.awardTo=duty(); break;
    case "phase": S.phase=v; tReset(PH[v].d); tStart(); tone(660); break;
    case "memo": case "memox": S.memo=!S.memo; break;
    case "crit": { const i=S.crit.indexOf(v); i<0?S.crit.push(v):S.crit.splice(i,1); break; }
    case "mode": S.mode=b.dataset.s; break;
    case "joker": { const i=+b.dataset.i, id=b.dataset.s, t=S.teams[i];
      if(id==="cours"){ useJ(i,"cours"); S.tLeft+=20; if(S.tRun) endAt+=20000; tone(660); toast(`📖 ${t.name} consulte son cours : +20 secondes`,2600); break; }
      if(S.armed[i]&&S.armed[i].type===id){ delete S.armed[i]; S.stealFrom=null; break; }
      if(id==="tor"){ S.armed[i]={type:"tor"}; S.stealFrom=null; tone(392); toast(`🎲 ${t.name} joue Tout ou rien !`,2400); }
      if(id==="vol"){ S.stealFrom=i; }
      break; }
    case "steal": { const i=+b.dataset.i; S.armed[i]={type:"vol",target:v}; S.stealFrom=null; tone(330); toast(`🦊 ${S.teams[i].name} tente de voler ${S.teams[v].name} !`,2600); break; }
    case "stealx": S.stealFrom=null; break;
    case "bopen": S.bOpen=true; S.justOpen=true; S.bEarly=null; tPause(); tone(1046); break;
    case "buzz": doBuzz(v); return;
    case "bgood": { const w=S.bWho; S.teams[w].score+=v; toast(`+${v} pour ${S.teams[w].name}`); S.bWho=null; S.bOpen=false; S.rev=true; break; }
    case "bwrong": { const w=S.bWho; if(v===-1){ S.teams[w].score-=1; } S.bOut.push(w); S.bWho=null; if(S.bOut.length>=S.teams.length){ S.bOpen=false; } else { S.bOpen=true; tStart(); } break; }
    case "bcancel": S.bWho=null; S.bOpen=true; tStart(); break;
    case "award": { const n=S.crit.length; S.teams[S.awardTo].score+=n; bump(S.awardTo,1); confetti(30+15*n); toast(`+${n} pour ${S.teams[S.awardTo].name}`); S.crit=[]; break; }
    default: return;
  }
  save(); render();
});
document.addEventListener("input", e=>{
  if(e.target.classList.contains("tname")){ S.teams[+e.target.dataset.i].name=e.target.value||("Équipe "+(+e.target.dataset.i+1)); save(); }
});
document.addEventListener("change", e=>{
  if(e.target.id==="tsel"){ tReset(+e.target.value); }
  if(e.target.id==="awardTo"){ S.awardTo=+e.target.value; }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape"&&(S.rules||S.memo)){ S.rules=false; S.memo=false; render(); return; }
});

function start(data){
  S=Object.assign(DEFAULT(), load(), data&&data.S?data.S:{});
  if(S.mode!=="cartons") S.mode="abcd";
  S.tRun=false; render();
  window.claude?.hot?.snapshot?.(()=>({S:{...S,tRun:false}}));
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
